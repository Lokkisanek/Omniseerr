services:
  omniseerr:
    build: .
    container_name: omniseerr
    ports:
      - "5056:5056"
      - "8080:8080"
    volumes:
      - omniseerr-config:/config
    environment:
      APP_URL: http://localhost:5056
      REVERB_HOST: localhost
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    restart: unless-stopped

volumes:
  omniseerr-config:
